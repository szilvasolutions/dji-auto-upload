[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "dji-auto-upload"
version = "0.3.1"
description = "Plug in your DJI drone. Walk away. Footage shows up in the cloud."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Szilva Solutions" }]
keywords = ["dji", "drone", "rclone", "backup", "automation", "google-photos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "platformdirs>=4.0",
    "tomlkit>=0.12",
    "filelock>=3.13",
    "requests>=2.31",
    "jinja2>=3.1",
    "pyobjc-framework-DiskArbitration>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
]

[project.urls]
Homepage = "https://github.com/szilvasolutions/dji-auto-upload"
Documentation = "https://github.com/szilvasolutions/dji-auto-upload#readme"
Issues = "https://github.com/szilvasolutions/dji-auto-upload/issues"

[project.scripts]
dji-auto-upload = "dji_auto_upload.cli:main"

[tool.hatch.build.targets.wheel]
# `packages` already ships everything under the package dir, templates included.
# Do not add a force-include for installers/templates: hatchling then tries to
# add each .j2 twice and hard-fails the wheel build.
packages = ["src/dji_auto_upload"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# E501 — long lines: covered by formatter, not worth fighting in messages
# B008  — typer's idiom is `param: T = typer.Option(...)`; the warning fires on every CLI param
# RUF001/RUF002/RUF003 — ambiguous Unicode chars: we send emojis on purpose to Telegram
# SIM105 — `with suppress(OSError)` is fine but more cryptic for a one-liner
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003", "SIM105"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: marks tests as integration (deselect with '-m \"not integration\"')",
]
