name: Release

# Publishes to PyPI when a v* tag is pushed, using Trusted Publishing (OIDC).
# No API token is stored anywhere: PyPI verifies the workflow's identity.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A tag that disagrees with pyproject would publish the wrong version
      # under the right name, and PyPI releases cannot be replaced.
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$tag pyproject=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match pyproject version $pkg"
            exit 1
          fi

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Verify the wheel installs and carries its templates
        # Assert the required templates are present by NAME, not by a brittle
        # count that has to be bumped every time a template is added.
        run: |
          python -m pip install --force-reinstall dist/*.whl
          dji-auto-upload version
          python - <<'PY'
          from pathlib import Path
          import dji_auto_upload.installers as i
          shipped = {p.name for p in (Path(i.__file__).parent / "templates").iterdir()}
          required = {
              "99-dji-auto-upload.rules.j2",
              "DjiAutoUploadTask.xml.j2",
              "com.dji-auto-upload.watcher.plist.j2",
              "dji-watcher.ps1.j2",
              "dji-run.ps1.j2",
              "dji-view.ps1.j2",
          }
          missing = required - shipped
          assert not missing, f"wheel is missing templates: {missing}"
          print("templates OK:", sorted(shipped))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Attach artifacts to the GitHub release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
                 --title "$tag" --notes "See CHANGELOG.md for the full notes."
          gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
