name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Test
        run: pytest -ra

      # An editable install never exercises the real wheel build, which is how a
      # broken package config (missing templates, duplicate paths) reaches users.
      - name: Build and smoke-test the wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
          python -m pip install --force-reinstall dist/*.whl
          dji-auto-upload version
          python -c "from pathlib import Path; import dji_auto_upload.installers as i; t=Path(i.__file__).parent/'templates'; assert sorted(p.suffix for p in t.iterdir()).count('.j2')==6, sorted(t.iterdir())"
        shell: bash
