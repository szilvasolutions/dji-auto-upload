name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Test
        run: pytest -ra

      # An editable install never exercises the real wheel build, which is how a
      # broken package config (missing templates, duplicate paths) reaches users.
      - name: Build and smoke-test the wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
          python -m pip install --force-reinstall dist/*.whl
          dji-auto-upload version
          python -c "from pathlib import Path; import dji_auto_upload.installers as i; s={p.name for p in (Path(i.__file__).parent/'templates').iterdir()}; req={'99-dji-auto-upload.rules.j2','DjiAutoUploadTask.xml.j2','com.dji-auto-upload.watcher.plist.j2','dji-watcher.ps1.j2','dji-run.ps1.j2','dji-view.ps1.j2','dji-watcher-launch.vbs.j2'}; assert req<=s, req-s"
        shell: bash
